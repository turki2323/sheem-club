<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>نادي شيم 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
/* هنا نضع كل التنسيقات (CSS) اللي كانت في كودك الأصلي */
:root{
  --rose:#FF4D8D;--rose-l:#FFE8F3;--navy:#1A1A3E;--sky:#38C9F0;--border:#F0D8E8;--muted:#9188A8;
}
body{font-family:'Noto Kufi Arabic',sans-serif;background-color:#FFF8FB;direction:rtl;margin:0;}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#FFF8FB;position:relative;}
.card{background:#fff;border-radius:18px;border:1.5px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,0.05);}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer;display:block;text-align:center;margin-bottom:10px;text-decoration:none;}
.btn-rose{background:var(--rose);color:#fff;}
.btn-navy{background:var(--navy);color:#fff;}
.field input{width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;text-align:center;box-sizing:border-box;}
/* ... باقي تنسيقاتك الرائعة ... */
</style>
</head>
<body>
<div id="app">
    <div id="pg-login" class="page active">
        <div style="text-align:center; padding: 40px 20px;">
            <div class="card">
                <h1 style="color:var(--rose)">🌸 نادي شيم</h1>
                <div class="field">
                    <input type="email" id="lu" placeholder="الإيميل أو الاسم">
                    <input type="password" id="lp" placeholder="كلمة المرور">
                </div>
                <button class="btn btn-rose" onclick="doLogin('member')">دخول العضوة</button>
                <button class="btn btn-navy" onclick="doLogin('admin')">دخول المشرفة</button>
                <p id="loginAlert" style="color:red; font-size:12px;"></p>
            </div>
        </div>
    </div>

    <div id="pg-dash" class="page" style="display:none">
        <div class="card">
            <h2>أهلاً بك 🌸</h2>
            <div id="user-data"></div>
            <button class="btn btn-navy" onclick="location.reload()">خروج</button>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDqMgyphHWJUOrMrnSy0AKmtXd2CRghrvs",
  authDomain: "sheem-club.firebaseapp.com",
  projectId: "sheem-club",
  storageBucket: "sheem-club.firebasestorage.app",
  messagingSenderId: "838391756999",
  appId: "1:838391756999:web:5204e5b1c50024009966e2",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// دالة الدخول الأصلية مع إصلاحات برمجية
async function doLogin(role){
  const val = document.getElementById("lu").value.trim();
  const pass = document.getElementById("lp").value;
  const alertBox = document.getElementById("loginAlert");

  if(!val || !pass){ alertBox.innerText="ادخلي بياناتك"; return; }

  try {
    const email = val.includes("@") ? val : val + "@sheem-club.app";
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const userDoc = await db.collection("users").doc(cred.user.uid).get();
    
    if(userDoc.exists && userDoc.data().role === role){
        document.getElementById("pg-login").style.display = "none";
        document.getElementById("pg-dash").style.display = "block";
        document.getElementById("user-data").innerHTML = `<h3>نقاطك: ${userDoc.data().points || 0}</h3>`;
    } else {
        alertBox.innerText = "الصلاحية غير صحيحة";
        auth.signOut();
    }
  } catch(e) {
    alertBox.innerText = "خطأ: تأكدي من البيانات";
  }
}
</script>
</body>
</html>
