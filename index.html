<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>نادي شيم 🌸</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --rose:#ff4d8d;
  --rose-light:#ffe8f3;
  --navy:#1a1a3e;
  --border:#f0d8e8;
  --muted:#9188a8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Noto Kufi Arabic',sans-serif;
  background:linear-gradient(180deg,#fff2f8,#fff);
  min-height:100vh;
}

#app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding:24px 16px;
}

.logo{
  text-align:center;
  margin-top:25px;
  margin-bottom:25px;
}

.logo-circle{
  width:92px;
  height:92px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff4d8d,#ff8fbd);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  box-shadow:0 12px 30px rgba(255,77,141,.3);
}

.logo h1{
  color:var(--rose);
  margin:14px 0 4px;
  font-size:28px;
}

.logo p{
  color:var(--muted);
  margin:0;
  font-size:14px;
}

.card{
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:28px;
  padding:18px;
  box-shadow:0 12px 40px rgba(255,77,141,.12);
}

.tabs{
  display:flex;
  background:#f8ddeb;
  border-radius:18px;
  padding:6px;
  gap:6px;
  margin-bottom:18px;
}

.tab{
  flex:1;
  border:0;
  background:transparent;
  padding:12px 6px;
  border-radius:14px;
  font-family:'Noto Kufi Arabic',sans-serif;
  font-weight:700;
  font-size:13px;
  color:#8f86a3;
  cursor:pointer;
}

.tab.active{
  background:#fff;
  color:var(--rose);
  box-shadow:0 5px 14px rgba(0,0,0,.06);
}

.field input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border:2px solid var(--border);
  border-radius:16px;
  font-family:'Noto Kufi Arabic',sans-serif;
  text-align:center;
  font-size:14px;
  outline:none;
}

.field input:focus{
  border-color:var(--rose);
}

.btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  font-family:'Noto Kufi Arabic',sans-serif;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}

.btn-rose{
  background:linear-gradient(135deg,#ff4d8d,#ff7aad);
  color:#fff;
}

.btn-navy{
  background:var(--navy);
  color:#fff;
}

.alert{
  text-align:center;
  color:#d93025;
  font-size:13px;
  min-height:22px;
}

.success{
  color:#198754;
}

.hidden{
  display:none;
}

.dash{
  text-align:center;
}
</style>
</head>

<body>

<div id="app">

  <div id="pg-login">

    <div class="logo">
      <div class="logo-circle">🌸</div>
      <h1>نادي شيم</h1>
      <p>منصتك الجميلة للعضوات والمشرفات</p>
    </div>

    <div class="card">

      <div class="tabs">
        <button class="tab active" onclick="showTab('login')">دخول</button>
        <button class="tab" onclick="showTab('register')">تسجيل جديد</button>
        <button class="tab" onclick="showTab('reset')">استعادة</button>
      </div>

      <div id="loginBox">
        <div class="field">
          <input type="email" id="lu" placeholder="الإيميل">
          <input type="password" id="lp" placeholder="كلمة المرور">
        </div>

        <button class="btn btn-rose" onclick="doLogin('member')">🌸 دخول العضوة</button>
        <button class="btn btn-navy" onclick="doLogin('admin')">👩‍💼 دخول المشرفة</button>
      </div>

      <div id="registerBox" class="hidden">
        <div class="field">
          <input type="text" id="ru" placeholder="الاسم">
          <input type="email" id="re" placeholder="الإيميل">
          <input type="password" id="rp" placeholder="كلمة المرور">
        </div>

        <button class="btn btn-rose" onclick="registerUser()">إنشاء حساب جديد</button>
      </div>

      <div id="resetBox" class="hidden">
        <div class="field">
          <input type="email" id="resetEmail" placeholder="اكتبي الإيميل">
        </div>

        <button class="btn btn-navy" onclick="resetPassword()">إرسال رابط الاستعادة</button>
      </div>

      <p id="msg" class="alert"></p>

    </div>
  </div>

  <div id="pg-dash" class="hidden">
    <div class="logo">
      <div class="logo-circle">🌸</div>
      <h1>أهلاً بك</h1>
    </div>

    <div class="card dash">
      <h2 id="welcomeName">مرحباً</h2>
      <p id="userRole"></p>
      <h3 id="userPoints"></h3>
      <button class="btn btn-navy" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDqMgyphHWJUOrMrnSy0AKmtXd2CRghrvs",
  authDomain: "sheem-club.firebaseapp.com",
  projectId: "sheem-club",
  storageBucket: "sheem-club.firebasestorage.app",
  messagingSenderId: "838391756999",
  appId: "1:838391756999:web:5204e5b1c50024009966e2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

function msg(text,type="error"){
  const box=document.getElementById("msg");
  box.innerText=text;
  box.className= type==="success" ? "alert success" : "alert";
}

function showTab(tab){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.add("hidden");
  document.getElementById("resetBox").classList.add("hidden");

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.classList.remove("active");
  });

  if(tab==="login"){
    document.getElementById("loginBox").classList.remove("hidden");
    document.querySelectorAll(".tab")[0].classList.add("active");
  }

  if(tab==="register"){
    document.getElementById("registerBox").classList.remove("hidden");
    document.querySelectorAll(".tab")[1].classList.add("active");
  }

  if(tab==="reset"){
    document.getElementById("resetBox").classList.remove("hidden");
    document.querySelectorAll(".tab")[2].classList.add("active");
  }

  msg("");
}

async function registerUser(){
  const name=document.getElementById("ru").value.trim();
  const email=document.getElementById("re").value.trim();
  const pass=document.getElementById("rp").value;

  if(!name || !email || !pass){
    msg("اكتبي الاسم والإيميل وكلمة المرور");
    return;
  }

  if(pass.length < 6){
    msg("كلمة المرور يجب أن تكون 6 أحرف أو أكثر");
    return;
  }

  try{
    const cred = await auth.createUserWithEmailAndPassword(email,pass);

    await db.collection("users").doc(cred.user.uid).set({
      name:name,
      email:email,
      role:"member",
      points:0,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    msg("تم إنشاء الحساب بنجاح 🌸 سجلي الدخول الآن","success");
    showTab("login");

  }catch(e){
    msg("خطأ في التسجيل: " + e.message);
  }
}

async function doLogin(role){
  const email=document.getElementById("lu").value.trim();
  const pass=document.getElementById("lp").value;

  if(!email || !pass){
    msg("اكتبي الإيميل وكلمة المرور");
    return;
  }

  try{
    const cred = await auth.signInWithEmailAndPassword(email,pass);
    const doc = await db.collection("users").doc(cred.user.uid).get();

    if(!doc.exists){
      msg("لا توجد بيانات لهذا الحساب");
      await auth.signOut();
      return;
    }

    const data = doc.data();

    if(data.role !== role){
      msg("الصلاحية غير صحيحة لهذا الزر");
      await auth.signOut();
      return;
    }

    document.getElementById("pg-login").classList.add("hidden");
    document.getElementById("pg-dash").classList.remove("hidden");

    document.getElementById("welcomeName").innerText = "مرحباً " + (data.name || "بك");
    document.getElementById("userRole").innerText = data.role === "admin" ? "حساب مشرفة" : "حساب عضوة";
    document.getElementById("userPoints").innerText = "النقاط: " + (data.points || 0);

  }catch(e){
    msg("خطأ في الدخول: تأكدي من الإيميل وكلمة المرور");
  }
}

async function resetPassword(){
  const email=document.getElementById("resetEmail").value.trim();

  if(!email){
    msg("اكتبي الإيميل أولاً");
    return;
  }

  try{
    await auth.sendPasswordResetEmail(email);
    msg("تم إرسال رابط استعادة كلمة المرور إلى الإيميل","success");
  }catch(e){
    msg("خطأ: " + e.message);
  }
}

async function logout(){
  await auth.signOut();
  location.reload();
}
</script>

</body>
</html>
