<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ff4d8d" />
<title>نادي شيم للفتيات</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --rose:#ff2f86;
  --rose2:#ff64a8;
  --rose-light:#ffeaf4;
  --rose-soft:#fff4fa;
  --navy:#19183c;
  --sky:#35c9f3;
  --text:#9188a8;
  --border:#f4d7e8;
  --shadow:0 18px 50px rgba(255,47,134,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Noto Kufi Arabic',system-ui,sans-serif;background:#fff7fb;color:var(--navy)}
body{background:linear-gradient(145deg,#fff 0%,#ffeaf4 45%,#fff 100%);}
#app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;padding:28px 18px 34px;position:relative;overflow:hidden}
#app:before,#app:after{content:"";position:absolute;border-radius:50%;filter:blur(18px);opacity:.45;pointer-events:none}
#app:before{width:190px;height:190px;background:#ffd4e9;top:55px;right:-90px}
#app:after{width:170px;height:170px;background:#e9f8ff;bottom:130px;left:-85px}
.page{position:relative;z-index:1;display:none}.page.active{display:block}
.logo-wrap{text-align:center;padding:8px 0 34px}.logo-box{width:min(232px,70vw);height:130px;margin:0 auto;background:#fff;border-radius:22px;display:grid;place-items:center;box-shadow:0 14px 35px rgba(255,77,141,.10);overflow:hidden}
.logo-text{line-height:1;text-align:center;font-weight:900;color:#1a1a57;font-size:46px;letter-spacing:-4px}.logo-text span{display:block;font-size:20px;color:#df5797;letter-spacing:0;margin-bottom:2px}.logo-text b{color:#28bde9;font-size:22px;margin-left:5px}
.login-card{background:#fff;border:2px solid var(--border);border-radius:22px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.login-card:before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--sky),#ab72d8,var(--rose))}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:#fde7f2;border-radius:18px;padding:4px;margin-bottom:26px;direction:ltr}.tab{direction:rtl;border:0;background:transparent;color:#9b93b2;border-radius:15px;padding:14px 8px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}.tab.active{background:#fff;color:var(--rose);box-shadow:0 0 0 2px #ffd3e8 inset}
.form-panel{display:none}.form-panel.active{display:block}.field{margin-bottom:18px}.field label{display:block;color:#8f86aa;font-weight:800;font-size:15px;margin-bottom:10px;text-align:right}.field input{width:100%;height:57px;border:2px solid var(--border);background:#fdeaf3;border-radius:17px;color:var(--navy);padding:0 16px;font-family:inherit;font-size:15px;text-align:center;outline:0;transition:.2s}.field input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(255,47,134,.08)}.field input::placeholder{color:#aaa}
.btn{width:100%;height:58px;border:0;border-radius:16px;font-family:inherit;font-weight:900;font-size:18px;cursor:pointer;margin-top:12px;transition:.18s;box-shadow:0 10px 20px rgba(0,0,0,.06)}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.65;cursor:not-allowed;transform:none}.btn-rose{background:linear-gradient(135deg,var(--rose2),var(--rose));color:#fff}.btn-navy{background:var(--navy);color:#fff}.btn-soft{background:#fff;color:var(--rose);border:2px solid #ffd4e8}.alert{min-height:24px;text-align:center;color:#e73575;font-size:13px;font-weight:700;margin:12px 0 0}.hint{text-align:center;color:#9b93b2;font-size:13px;line-height:1.9;margin:4px 0 14px}.dash{padding-top:36px}.dash-card{background:#fff;border:2px solid var(--border);border-radius:22px;padding:22px;box-shadow:var(--shadow);text-align:center}.points{font-size:32px;font-weight:900;color:var(--rose);margin:8px 0 18px}
@media (max-width:360px){#app{padding-left:12px;padding-right:12px}.tab{font-size:13px}.logo-box{height:116px}.logo-text{font-size:39px}.btn{font-size:16px}}
</style>
</head>
<body>
<div id="app">
  <section id="pg-login" class="page active">
    <div class="logo-wrap">
      <div class="logo-box" aria-label="شعار نادي شيم">
        <div class="logo-text"><span><b>نادي</b> للفتيات</span>شيم</div>
      </div>
    </div>

    <div class="login-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">دخول</button>
        <button class="tab" data-tab="signup">تسجيل جديد</button>
        <button class="tab" data-tab="reset">استعادة كلمة المرور</button>
      </div>

      <div id="panel-login" class="form-panel active">
        <div class="field">
          <label for="lu">الإيميل أو الاسم</label>
          <input id="lu" autocomplete="username" placeholder="example@gmail.com أو شيماء" />
        </div>
        <div class="field">
          <label for="lp">كلمة المرور</label>
          <input id="lp" type="password" autocomplete="current-password" placeholder="••••••" />
        </div>
        <button class="btn btn-rose" onclick="doLogin('member')">🌸 دخول العضوة</button>
        <button class="btn btn-navy" onclick="doLogin('admin')">👩‍💼 دخول المشرفة</button>
        <p id="loginAlert" class="alert"></p>
      </div>

      <div id="panel-signup" class="form-panel">
        <p class="hint">إنشاء عضوية جديدة في نادي شيم.</p>
        <div class="field"><label for="sn">اسم العضوة</label><input id="sn" type="text" autocomplete="name" placeholder="مثال: شيماء" /></div>
        <div class="field"><label for="su">الإيميل</label><input id="su" type="email" autocomplete="email" placeholder="example@gmail.com" /></div>
        <div class="field"><label for="sp">كلمة المرور</label><input id="sp" type="password" autocomplete="new-password" placeholder="6 أحرف أو أكثر" /></div>
        <div class="field"><label for="sp2">تأكيد كلمة المرور</label><input id="sp2" type="password" autocomplete="new-password" placeholder="أعيدي كتابة كلمة المرور" /></div>
        <button id="signupBtn" class="btn btn-rose" onclick="signUp()">إنشاء حساب 🌸</button>
        <p id="signupAlert" class="alert"></p>
      </div>

      <div id="panel-reset" class="form-panel">
        <p class="hint">أدخلي بريدك وسيتم إرسال رابط استعادة كلمة المرور.</p>
        <div class="field"><label for="ru">الإيميل</label><input id="ru" type="email" placeholder="example@gmail.com" /></div>
        <button class="btn btn-soft" onclick="resetPassword()">إرسال رابط الاستعادة</button>
        <p id="resetAlert" class="alert"></p>
      </div>
    </div>
  </section>

  <section id="pg-dash" class="page dash">
    <div class="dash-card">
      <h2>أهلاً بك في نادي شيم 🌸</h2>
      <div id="user-data" class="points"></div>
      <button class="btn btn-navy" onclick="logout()">خروج</button>
    </div>
  </section>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDqMgyphHWJUOrMrnSy0AKmtXd2CRghrvs",
  authDomain: "sheem-club.firebaseapp.com",
  projectId: "sheem-club",
  storageBucket: "sheem-club.firebasestorage.app",
  messagingSenderId: "838391756999",
  appId: "1:838391756999:web:5204e5b1c50024009966e2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

function emailFromValue(value){
  const v = value.trim();
  return v.includes('@') ? v : `${v}@sheem-club.app`;
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
  });
});

async function doLogin(role){
  const val = document.getElementById('lu').value.trim();
  const pass = document.getElementById('lp').value;
  const alertBox = document.getElementById('loginAlert');
  alertBox.textContent = '';

  if(!val || !pass){ alertBox.textContent='ادخلي الإيميل أو الاسم وكلمة المرور'; return; }

  try{
    const cred = await auth.signInWithEmailAndPassword(emailFromValue(val), pass);
    const snap = await db.collection('users').doc(cred.user.uid).get();
    const data = snap.exists ? snap.data() : {};

    if((data.role || 'member') !== role){
      await auth.signOut();
      alertBox.textContent = role === 'admin' ? 'هذا الحساب ليس حساب مشرفة' : 'هذا الحساب ليس حساب عضوة';
      return;
    }

    await db.collection('users').doc(cred.user.uid).set({lastLoginAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    document.getElementById('user-data').innerHTML = `${data.name ? 'أهلاً ' + data.name + '<br>' : ''}نقاطك: ${data.points || 0}`;
    showPage('pg-dash');
  }catch(e){
    alertBox.textContent = 'تعذر الدخول، تأكدي من البيانات أو الاتصال';
    console.error(e);
  }
}

async function signUp(){
  const name = document.getElementById('sn').value.trim();
  const email = document.getElementById('su').value.trim().toLowerCase();
  const pass = document.getElementById('sp').value;
  const pass2 = document.getElementById('sp2').value;
  const box = document.getElementById('signupAlert');
  const btn = document.getElementById('signupBtn');

  box.style.color = '#e73575';
  box.textContent = '';

  if(!name || !email || !pass || !pass2){
    box.textContent='أكملي الاسم والإيميل وكلمة المرور';
    return;
  }
  if(!email.includes('@') || !email.includes('.')){
    box.textContent='اكتبي بريد إلكتروني صحيح';
    return;
  }
  if(pass.length < 6){
    box.textContent='كلمة المرور يجب أن تكون 6 أحرف أو أكثر';
    return;
  }
  if(pass !== pass2){
    box.textContent='كلمتا المرور غير متطابقتين';
    return;
  }

  try{
    btn.disabled = true;
    btn.textContent = 'جاري إنشاء الحساب...';

    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({displayName:name});

    await db.collection('users').doc(cred.user.uid).set({
      uid: cred.user.uid,
      name,
      email,
      role:'member',
      points:0,
      level:'عضوة جديدة',
      status:'active',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastLoginAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});

    try { await cred.user.sendEmailVerification(); } catch(_) {}

    box.style.color = '#1c9b62';
    box.textContent = 'تم إنشاء الحساب بنجاح 🌸 يمكنك الدخول الآن';

    document.getElementById('lu').value = email;
    document.getElementById('lp').value = '';
    setTimeout(()=>{
      document.querySelector('[data-tab="login"]').click();
    }, 900);
  }catch(e){
    box.style.color = '#e73575';
    if(e.code === 'auth/email-already-in-use') box.textContent = 'هذا البريد مسجل من قبل، جربي الدخول أو استعادة كلمة المرور';
    else if(e.code === 'auth/invalid-email') box.textContent = 'البريد الإلكتروني غير صحيح';
    else if(e.code === 'auth/weak-password') box.textContent = 'كلمة المرور ضعيفة، اختاري كلمة أقوى';
    else box.textContent = 'تعذر إنشاء الحساب، تأكدي من إعدادات Firebase';
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.textContent = 'إنشاء حساب 🌸';
  }
}

async function resetPassword(){
  const email = document.getElementById('ru').value.trim();
  const box = document.getElementById('resetAlert');
  box.textContent = '';
  if(!email){ box.textContent='اكتبي الإيميل أولاً'; return; }
  try{
    await auth.sendPasswordResetEmail(email);
    box.style.color = '#1c9b62';
    box.textContent = 'تم إرسال رابط الاستعادة إلى بريدك';
  }catch(e){
    box.style.color = '#e73575';
    box.textContent = 'تعذر إرسال الرابط، تأكدي من البريد';
    console.error(e);
  }
}

async function logout(){
  await auth.signOut();
  showPage('pg-login');
}
</script>
</body>
</html>
